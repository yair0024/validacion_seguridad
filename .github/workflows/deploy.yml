name: Desplegar prototipo en GitHub Pages

# Publica los bocetos estaticos en GitHub Pages.
# Se ejecuta en cada push a main y tambien se puede lanzar a mano desde la pestana Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos minimos que necesita la accion oficial de Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un solo despliegue a la vez; si llega uno nuevo, cancela el anterior en cola.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Habilita Pages automaticamente la primera vez (enablement: true),
      # asi no hace falta activarlo a mano en Settings.
      - name: Configurar Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      # Sube todo el repo como sitio estatico. .git se excluye solo.
      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
